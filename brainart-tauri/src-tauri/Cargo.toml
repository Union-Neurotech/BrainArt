[package]
name = "brainart-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "brainart_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ── Features ──────────────────────────────────────────────────────────────────
# Enable real EEG hardware support via BrainFlow.
#
# SETUP REQUIRED before enabling this feature:
#   1. git clone https://github.com/brainflow-dev/brainflow  brainflow-sdk
#      (clone into the workspace root, one level above src-tauri/)
#   2. Download the Windows pre-built libs from:
#      https://github.com/brainflow-dev/brainflow/releases
#      and extract the DLLs (BoardController.dll, DataHandler.dll, MLModule.dll)
#      into  brainflow-sdk/rust_package/brainflow/lib/
#   3. Uncomment the brainflow path dependency below and run:
#        cargo build --features brainflow-hardware
[features]
default = []
brainflow-hardware = ["dep:brainflow", "dep:ndarray"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6.2"

# BrainFlow Rust binding — NOT on crates.io; must be installed locally.
# Uncomment the line below once you have completed the setup above:
# brainflow = { path = "../brainflow-sdk/rust_package/brainflow", optional = true }
ndarray = { version = "0.15", optional = true }

