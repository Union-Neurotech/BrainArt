<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainArt · Emotion-Driven</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;overflow:hidden;font-family:'Courier New',monospace;color:#fff}

#canvas-wrap{position:fixed;top:0;left:0;right:320px;bottom:0}
canvas{display:block;width:100%;height:100%}

#panel{
  position:fixed;top:0;right:0;bottom:0;width:320px;
  background:#0d0d0d;border-left:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;overflow:hidden;
}

#panel-header{
  padding:15px 18px 11px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
#panel-header h1{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.8);font-weight:normal;margin-bottom:2px;
}
#panel-header p{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:.05em}

#panel-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
#panel-scroll::-webkit-scrollbar{width:3px}
#panel-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.sec{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
.sec-title{
  font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.22);margin-bottom:11px;
}

/* ── SLIDER ROW ── */
.sl-row{
  display:grid;grid-template-columns:100px 1fr 34px;
  align-items:center;gap:0 8px;margin-bottom:9px;
}
.sl-row:last-child{margin-bottom:0}

.sl-label{font-size:10px;color:rgba(255,255,255,.5);line-height:1.2}
.sl-label small{display:block;font-size:8px;color:rgba(255,255,255,.2);margin-top:1px;letter-spacing:.02em}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;height:2px;border-radius:1px;
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  cursor:pointer;box-shadow:0 0 0 2px rgba(0,0,0,.7);
  transition:transform .1s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;border:none;cursor:pointer;
}

/* group accent colours */
.emotion-sl{background:rgba(255,120,70,.2)}
.emotion-sl::-webkit-slider-thumb{background:#ff7846}
.emotion-sl::-moz-range-thumb{background:#ff7846}

.eeg-sl{background:rgba(80,160,255,.2)}
.eeg-sl::-webkit-slider-thumb{background:#50a0ff}
.eeg-sl::-moz-range-thumb{background:#50a0ff}

.ml-sl{background:rgba(100,230,150,.2)}
.ml-sl::-webkit-slider-thumb{background:#64e696}
.ml-sl::-moz-range-thumb{background:#64e696}

.sl-val{
  font-size:10px;color:rgba(255,255,255,.55);font-weight:bold;
  text-align:right;font-variant-numeric:tabular-nums;
}

/* ── PRESETS ── */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:10px;padding:4px 9px;border-radius:20px;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.5);letter-spacing:.02em;
  transition:all .13s;user-select:none;
}
.chip:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
.chip:active{transform:scale(.95)}

/* ── FOOTER BUTTONS ── */
#panel-footer{
  padding:11px 18px 13px;border-top:1px solid rgba(255,255,255,.06);
  flex-shrink:0;display:flex;flex-direction:column;gap:7px;
}
.btn-row{display:flex;gap:7px}
.btn{
  flex:1;padding:8px 6px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:7px;color:rgba(255,255,255,.55);
  font-family:'Courier New',monospace;font-size:10px;letter-spacing:.06em;
  cursor:pointer;transition:all .12s;
}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.btn:active{transform:scale(.97)}
.btn.lit{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}

#seed-line{font-size:9px;color:rgba(255,255,255,.18);text-align:center;letter-spacing:.06em}
</style>
</head>
<body>

<div id="canvas-wrap"><canvas id="c"></canvas></div>

<div id="panel">
  <div id="panel-header">
    <h1>BrainArt</h1>
    <p>emotion + EEG → realtime visual</p>
  </div>

  <div id="panel-scroll">

    <div class="sec">
      <div class="sec-title">Emotion</div>
      <div id="sl-emotion"></div>
    </div>

    <div class="sec">
      <div class="sec-title">EEG Bands</div>
      <div id="sl-eeg"></div>
    </div>

    <div class="sec">
      <div class="sec-title">ML Metrics</div>
      <div id="sl-ml"></div>
    </div>

    <div class="sec">
      <div class="sec-title">Presets</div>
      <div class="chips" id="presets"></div>
    </div>

  </div>

  <div id="panel-footer">
    <div class="btn-row">
      <button class="btn lit" id="bAnim">anim: on</button>
      <button class="btn" id="bNew">new seed</button>
      <button class="btn" id="bSnap">save png</button>
    </div>
    <div id="seed-line">seed: <span id="dSeed">—</span></div>
  </div>
</div>

<script>
(function(){

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false})
        ||canvas.getContext('experimental-webgl',{preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<p style="color:#f55;padding:2rem">WebGL required</p>';return;}

const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 res;
uniform float t,seed;
uniform float u_zoom,u_warp,u_speed,u_sat;
uniform float u_hue_shift,u_warm,u_complexity,u_chaos,u_radial;
uniform float u_offset_x,u_offset_y;
uniform vec2 u_mouse;uniform float u_mouse_str;
float th(float x){float c=clamp(x,-8.,8.);float e=exp(-2.*c);return(1.-e)/(1.+e);}
float h1(float n){return fract(sin(n)*43758.5453123);}
float h2(float a,float b){return h1(a+b*127.1);}
float W(float l,float i,float o){return th(h2(l*200.+i*13.+seed,o*7.+seed*3.)*4.-2.);}
float Wb(float l,float o){return th(h2(l*300.+o*17.,seed*5.)*3.-1.5);}
vec3 hueRot(vec3 col,float angle){
  float c=cos(angle),s=sin(angle);
  mat3 m=mat3(.299+.701*c+.168*s,.299-.299*c+.328*s,.299-.300*c-.328*s,
              .587-.587*c-.330*s,.587+.413*c+.035*s,.587-.588*c+.292*s,
              .114-.114*c+.497*s,.114-.114*c-.353*s,.114+.886*c+.023*s);
  return clamp(m*col,0.,1.);
}
void main(){
  vec2 uv=(gl_FragCoord.xy/res-.5)*2.;
  uv.x*=res.x/res.y; uv*=u_zoom;
  uv+=vec2(u_offset_x,u_offset_y)*0.6;
  float ts=t*u_speed;
  vec2 md=uv-u_mouse; float mr=length(md);
  float mw=u_mouse_str*exp(-mr*mr*1.8);
  float mang=atan(md.y,md.x);
  uv+=vec2(cos(mang+1.5708),sin(mang+1.5708))*mw*.4;
  uv+=md*(-mw*.25/(mr+.001));
  float r=length(uv),ang=atan(uv.y,uv.x);
  float sr=r+u_chaos*0.4*sin(ang*3.+ts*0.7+r*2.);
  float sa=ang+u_chaos*0.5*cos(r*4.+ts*0.5)*exp(-r*0.4);
  vec2 wv=vec2(sr*cos(sa),sr*sin(sa));
  float wx=wv.x,wy=wv.y,wr=length(wv);
  wx=mix(wx,wr*cos(ang),u_radial); wy=mix(wy,wr*sin(ang),u_radial);
  float in0=wx,in1=wy,in2=wr,in3=sin(ang),in4=cos(ang),in5=sin(wr*3.14159),in6=sin(ts);
  float cplx=0.7+u_complexity*1.3;
  float n0=th((W(0.,0.,0.)*in0+W(0.,1.,0.)*in1+W(0.,2.,0.)*in2+W(0.,3.,0.)*in3+W(0.,4.,0.)*in4+W(0.,5.,0.)*in5+W(0.,6.,0.)*in6+Wb(0.,0.))*cplx);
  float n1=th((W(0.,0.,1.)*in0+W(0.,1.,1.)*in1+W(0.,2.,1.)*in2+W(0.,3.,1.)*in3+W(0.,4.,1.)*in4+W(0.,5.,1.)*in5+W(0.,6.,1.)*in6+Wb(0.,1.))*cplx);
  float n2=th((W(0.,0.,2.)*in0+W(0.,1.,2.)*in1+W(0.,2.,2.)*in2+W(0.,3.,2.)*in3+W(0.,4.,2.)*in4+W(0.,5.,2.)*in5+W(0.,6.,2.)*in6+Wb(0.,2.))*cplx);
  float n3=th((W(0.,0.,3.)*in0+W(0.,1.,3.)*in1+W(0.,2.,3.)*in2+W(0.,3.,3.)*in3+W(0.,4.,3.)*in4+W(0.,5.,3.)*in5+W(0.,6.,3.)*in6+Wb(0.,3.))*cplx);
  float n4=th((W(0.,0.,4.)*in0+W(0.,1.,4.)*in1+W(0.,2.,4.)*in2+W(0.,3.,4.)*in3+W(0.,4.,4.)*in4+W(0.,5.,4.)*in5+W(0.,6.,4.)*in6+Wb(0.,4.))*cplx);
  float n5=th((W(0.,0.,5.)*in0+W(0.,1.,5.)*in1+W(0.,2.,5.)*in2+W(0.,3.,5.)*in3+W(0.,4.,5.)*in4+W(0.,5.,5.)*in5+W(0.,6.,5.)*in6+Wb(0.,5.))*cplx);
  float m0=th((W(1.,0.,0.)*n0+W(1.,1.,0.)*n1+W(1.,2.,0.)*n2+W(1.,3.,0.)*n3+W(1.,4.,0.)*n4+W(1.,5.,0.)*n5+Wb(1.,0.))*cplx);
  float m1=th((W(1.,0.,1.)*n0+W(1.,1.,1.)*n1+W(1.,2.,1.)*n2+W(1.,3.,1.)*n3+W(1.,4.,1.)*n4+W(1.,5.,1.)*n5+Wb(1.,1.))*cplx);
  float m2=th((W(1.,0.,2.)*n0+W(1.,1.,2.)*n1+W(1.,2.,2.)*n2+W(1.,3.,2.)*n3+W(1.,4.,2.)*n4+W(1.,5.,2.)*n5+Wb(1.,2.))*cplx);
  float m3=th((W(1.,0.,3.)*n0+W(1.,1.,3.)*n1+W(1.,2.,3.)*n2+W(1.,3.,3.)*n3+W(1.,4.,3.)*n4+W(1.,5.,3.)*n5+Wb(1.,3.))*cplx);
  float m4=th((W(1.,0.,4.)*n0+W(1.,1.,4.)*n1+W(1.,2.,4.)*n2+W(1.,3.,4.)*n3+W(1.,4.,4.)*n4+W(1.,5.,4.)*n5+Wb(1.,4.))*cplx);
  float m5=th((W(1.,0.,5.)*n0+W(1.,1.,5.)*n1+W(1.,2.,5.)*n2+W(1.,3.,5.)*n3+W(1.,4.,5.)*n4+W(1.,5.,5.)*n5+Wb(1.,5.))*cplx);
  float warp=u_warp;
  float p0=th((W(2.,0.,0.)*m0+W(2.,1.,0.)*m1+W(2.,2.,0.)*m2+W(2.,3.,0.)*m3+W(2.,4.,0.)*m4+W(2.,5.,0.)*m5+sin(wr*6.28318*warp)*0.4+Wb(2.,0.))*cplx);
  float p1=th((W(2.,0.,1.)*m0+W(2.,1.,1.)*m1+W(2.,2.,1.)*m2+W(2.,3.,1.)*m3+W(2.,4.,1.)*m4+W(2.,5.,1.)*m5+cos(ang*2.*warp)*0.4+Wb(2.,1.))*cplx);
  float p2=th((W(2.,0.,2.)*m0+W(2.,1.,2.)*m1+W(2.,2.,2.)*m2+W(2.,3.,2.)*m3+W(2.,4.,2.)*m4+W(2.,5.,2.)*m5+sin(ang*3.*warp+wr)*0.4+Wb(2.,2.))*cplx);
  float cr=th(W(3.,0.,0.)*p0+W(3.,1.,0.)*p1+W(3.,2.,0.)*p2+W(3.,3.,0.)*m0+W(3.,4.,0.)*m3+Wb(3.,0.));
  float cg=th(W(3.,0.,1.)*p0+W(3.,1.,1.)*p1+W(3.,2.,1.)*p2+W(3.,3.,1.)*m1+W(3.,4.,1.)*m4+Wb(3.,1.));
  float cb=th(W(3.,0.,2.)*p0+W(3.,1.,2.)*p1+W(3.,2.,2.)*p2+W(3.,3.,2.)*m2+W(3.,4.,2.)*m5+Wb(3.,2.));
  vec3 col=vec3(cr,cg,cb)*.5+.5;
  float lum=dot(col,vec3(0.2126,0.7152,0.0722));
  col=mix(vec3(lum),col,u_sat);
  col=hueRot(col,u_hue_shift*1.0472);
  col.r=mix(col.r,min(col.r*1.18,1.),max(u_warm,0.)*.35);
  col.b=mix(col.b,min(col.b*1.18,1.),max(-u_warm,0.)*.35);
  col=clamp(col,0.,1.);
  gl_FragColor=vec4(col,1.);
}
`;

function mkS(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(sh));return sh;}
const prog=gl.createProgram();
gl.attachShader(prog,mkS(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mkS(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);
const qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const UL={};
['res','t','seed','u_zoom','u_warp','u_speed','u_sat','u_hue_shift','u_warm','u_complexity','u_chaos','u_radial','u_offset_x','u_offset_y','u_mouse','u_mouse_str']
  .forEach(n=>UL[n]=gl.getUniformLocation(prog,n));

// ── State ─────────────────────────────────────────────────────────────────────
const E={
  valence:0,arousal:0,
  alpha:0.5,beta:0.4,theta:0.3,delta:0.2,gamma:0.3,
  mindfulness:0.5,concentration:0.5,relaxation:0.5
};

function etov(){
  const v=E.valence,a=E.arousal,absV=Math.abs(v);
  const md=1-E.mindfulness*0.6, cb=E.concentration*0.5, rs=E.relaxation*0.4;
  return{
    hue_shift:v, warm:v,
    sat:  1.0+absV*1.2+E.gamma*1.5,
    zoom: 0.7+(1-a)*0.5+(1-E.beta)*0.5+rs,
    complexity: 0.3+a*0.5+E.beta*0.4+cb,
    chaos: E.theta*1.8*md,
    radial: E.alpha*0.85,
    speed: (0.02+E.delta*0.12+Math.max(a,0)*0.06)*md,
    warp:  0.3+E.gamma*0.6+Math.max(a,0)*0.4,
    offset_x:0, offset_y:0
  };
}

// ── Resize ────────────────────────────────────────────────────────────────────
let W_=0,H_=0;
function resize(){
  const wrap=document.getElementById('canvas-wrap');
  W_=wrap.clientWidth;H_=wrap.clientHeight;
  canvas.width=W_;canvas.height=H_;
  gl.viewport(0,0,W_,H_);
  gl.uniform2f(UL.res,W_,H_);
}
window.addEventListener('resize',resize);resize();

// ── Render ────────────────────────────────────────────────────────────────────
let animOn=true,t0=performance.now(),tOffset=0,seed=5;
const mouse={x:0,y:0,str:0,down:false};
function render(ts){
  const elapsed=animOn?(ts-t0)/1000:tOffset;
  if(!mouse.down)mouse.str=Math.max(0,mouse.str-.025);
  const V=etov();
  gl.uniform1f(UL.t,elapsed);gl.uniform1f(UL.seed,seed);
  gl.uniform1f(UL.u_zoom,V.zoom);gl.uniform1f(UL.u_warp,V.warp);
  gl.uniform1f(UL.u_speed,V.speed);gl.uniform1f(UL.u_sat,V.sat);
  gl.uniform1f(UL.u_hue_shift,V.hue_shift);gl.uniform1f(UL.u_warm,V.warm);
  gl.uniform1f(UL.u_complexity,V.complexity);gl.uniform1f(UL.u_chaos,V.chaos);
  gl.uniform1f(UL.u_radial,V.radial);
  gl.uniform1f(UL.u_offset_x,V.offset_x);gl.uniform1f(UL.u_offset_y,V.offset_y);
  gl.uniform2f(UL.u_mouse,mouse.x,mouse.y);gl.uniform1f(UL.u_mouse_str,mouse.str);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function toNDC(cx,cy){return[((cx/W_)*2-1)*(W_/H_),-((cy/H_)*2-1)];}
canvas.addEventListener('mousemove',e=>{[mouse.x,mouse.y]=toNDC(e.clientX,e.clientY);if(mouse.down)mouse.str=Math.min(mouse.str+.07,1.2);});
canvas.addEventListener('mousedown',()=>{mouse.down=true;mouse.str=.35;});
canvas.addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('mouseleave',()=>mouse.down=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];[mouse.x,mouse.y]=toNDC(t.clientX,t.clientY);mouse.down=true;mouse.str=.4;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];[mouse.x,mouse.y]=toNDC(t.clientX,t.clientY);mouse.str=Math.min(mouse.str+.05,1.2);},{passive:false});
canvas.addEventListener('touchend',()=>mouse.down=false);

// ── Slider builder ────────────────────────────────────────────────────────────
function mkSlider(parent,{key,label,hint,min,max,step,cls}){
  const row=document.createElement('div');
  row.className='sl-row';
  const v=E[key];
  const fmt=n=>step<0.1?n.toFixed(2):n.toFixed(1);
  row.innerHTML=`
    <div class="sl-label">${label}<small>${hint}</small></div>
    <input type="range" class="${cls}" id="sl_${key}" min="${min}" max="${max}" step="${step}" value="${v}">
    <div class="sl-val" id="sv_${key}">${fmt(v)}</div>
  `;
  parent.appendChild(row);
  row.querySelector('input').addEventListener('input',function(){
    E[key]=+this.value;
    document.getElementById('sv_'+key).textContent=fmt(+this.value);
  });
}

const eCont=document.getElementById('sl-emotion');
const eegCont=document.getElementById('sl-eeg');
const mlCont=document.getElementById('sl-ml');

[
  {key:'valence',label:'Valence',    hint:'warm ↔ cool hue',     min:-1,max:1,  step:.01,cls:'emotion-sl'},
  {key:'arousal',label:'Arousal',    hint:'zoom + structure',     min:-1,max:1,  step:.01,cls:'emotion-sl'},
].forEach(d=>mkSlider(eCont,d));

[
  {key:'alpha', label:'Alpha (α)', hint:'radial smoothing',  min:0,max:1,step:.01,cls:'eeg-sl'},
  {key:'beta',  label:'Beta (β)',  hint:'complexity + zoom', min:0,max:1,step:.01,cls:'eeg-sl'},
  {key:'theta', label:'Theta (θ)', hint:'spiral chaos',      min:0,max:1,step:.01,cls:'eeg-sl'},
  {key:'delta', label:'Delta (δ)', hint:'animation speed',   min:0,max:1,step:.01,cls:'eeg-sl'},
  {key:'gamma', label:'Gamma (γ)', hint:'saturation + warp', min:0,max:1,step:.01,cls:'eeg-sl'},
].forEach(d=>mkSlider(eegCont,d));

[
  {key:'mindfulness',   label:'Mindfulness',   hint:'damps speed + chaos', min:0,max:1,step:.01,cls:'ml-sl'},
  {key:'concentration', label:'Concentration', hint:'sharpens structure',  min:0,max:1,step:.01,cls:'ml-sl'},
  {key:'relaxation',    label:'Relaxation',    hint:'softens zoom',        min:0,max:1,step:.01,cls:'ml-sl'},
].forEach(d=>mkSlider(mlCont,d));

// ── Presets ───────────────────────────────────────────────────────────────────
const PRESETS=[
  {l:'😌 calm',    p:{valence:.4, arousal:-.5,alpha:.8,beta:.2,theta:.15,delta:.15,gamma:.35,mindfulness:.8,concentration:.3,relaxation:.8}},
  {l:'😄 euphoric',p:{valence:.9, arousal:.8, alpha:.3,beta:.7,theta:.4, delta:.4, gamma:.85,mindfulness:.3,concentration:.8,relaxation:.2}},
  {l:'😰 anxious', p:{valence:-.7,arousal:.85,alpha:.1,beta:.75,theta:.8,delta:.35,gamma:.5, mindfulness:.1,concentration:.6,relaxation:.1}},
  {l:'😢 sad',     p:{valence:-.6,arousal:-.6,alpha:.6,beta:.2,theta:.2, delta:.1, gamma:.2, mindfulness:.4,concentration:.2,relaxation:.5}},
  {l:'🧘 meditate',p:{valence:.2, arousal:-.7,alpha:.9,beta:.1,theta:.6, delta:.05,gamma:.2, mindfulness:.95,concentration:.2,relaxation:.9}},
  {l:'🔥 intense', p:{valence:.5, arousal:.95,alpha:.2,beta:.9,theta:.7, delta:.6, gamma:.9, mindfulness:.05,concentration:.95,relaxation:.05}},
  {l:'😤 angry',   p:{valence:-.8,arousal:.9, alpha:.05,beta:.85,theta:.9,delta:.5,gamma:.6, mindfulness:.05,concentration:.7,relaxation:.05}},
  {l:'✨ awe',     p:{valence:.7, arousal:.5, alpha:.5,beta:.5,theta:.35,delta:.2, gamma:.7, mindfulness:.6,concentration:.5,relaxation:.5}},
];

function applyPreset(p){
  Object.assign(E,p);
  Object.keys(p).forEach(k=>{
    const inp=document.getElementById('sl_'+k);
    const val=document.getElementById('sv_'+k);
    if(!inp)return;
    inp.value=E[k];
    const st=parseFloat(inp.step)||.01;
    val.textContent=st<0.1?E[k].toFixed(2):E[k].toFixed(1);
  });
}

const preCont=document.getElementById('presets');
PRESETS.forEach(({l,p})=>{
  const b=document.createElement('div');
  b.className='chip';b.textContent=l;
  b.addEventListener('click',()=>applyPreset(p));
  preCont.appendChild(b);
});

// ── Buttons ───────────────────────────────────────────────────────────────────
function newSeed(){
  seed=Math.random()*20;
  t0=performance.now();tOffset=0;
  document.getElementById('dSeed').textContent=seed.toFixed(3);
}
newSeed();

const bAnim=document.getElementById('bAnim');
bAnim.addEventListener('click',()=>{
  animOn=!animOn;
  if(animOn)t0=performance.now()-tOffset*1000;
  else tOffset=(performance.now()-t0)/1000;
  bAnim.textContent='anim: '+(animOn?'on':'off');
  bAnim.classList.toggle('lit',animOn);
});
document.getElementById('bNew').addEventListener('click',newSeed);
document.getElementById('bSnap').addEventListener('click',()=>{
  requestAnimationFrame(()=>{
    const a=document.createElement('a');
    a.download=`brainart_${Date.now()}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
  });
});

})();
</script>
</body>
</html>
